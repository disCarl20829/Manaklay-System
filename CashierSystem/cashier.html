<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cashier System - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="./../resources/logo.jpg">
    <style>
        :root {
            --bg-light: #f5f5f7;
            --panel-bg: #ffffff;
            --card-bg: #d1d1d6;
            --dark-gray: #4b4b4b;
            --text-main: #000000;
            --border-color: #e5e5ea;
            --blue-accent: #007AFF;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-light);
            overflow: hidden;
        }

        /* --- LEFT PANEL --- */
        .main-panel {
            flex: 6.5;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            background-color: var(--bg-light);
        }

        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn-back {
            display: none;
            background-color: var(--dark-gray);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            margin-right: 15px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
        }

        .search-bar {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border-radius: 25px;
            border: none;
            background-color: var(--dark-gray);
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        .search-bar::placeholder {
            color: #a0a0a0;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0a0;
            font-size: 1.2rem;
        }

        .dynamic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            align-content: start;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        .category-card:active {
            opacity: 0.7;
        }

        .category-card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .category-card .name {
            font-size: 1.2rem;
            text-transform: capitalize;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 0.1s;
            position: relative;
        }

        .product-card:active {
            opacity: 0.7;
        }

        .product-card img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product-card .details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        .product-card .name {
            font-size: 1rem;
            font-weight: 500;
        }

        .product-card .price {
            font-size: 1rem;
            font-weight: 700;
        }

        .product-card.out-of-stock {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .oos-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
        }

        .cashier-info {
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .cashier-info span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background-color: var(--dark-gray);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* --- RIGHT PANEL --- */
        .order-panel {
            flex: 3.5;
            background-color: var(--panel-bg);
            border-left: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
        }

        .order-panel::before {
            content: "Manaklay";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.03);
            z-index: 0;
            pointer-events: none;
        }

        .order-header h2 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        .order-table-headers {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.2fr;
            gap: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dark-gray);
            margin-bottom: 10px;
            z-index: 1;
            position: relative;
        }

        .order-items-list {
            flex-grow: 1;
            overflow-y: auto;
            z-index: 1;
            position: relative;
        }

        .cart-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.2fr;
            gap: 5px;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .cart-acts {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .cart-acts span {
            cursor: pointer;
            padding: 2px 6px;
            user-select: none;
        }

        .qty-input {
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 4px;
            background-color: var(--bg-light);
            outline: none;
        }

        .order-total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        .btn-place-order {
            width: 100%;
            background-color: var(--dark-gray);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 1;
            position: relative;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal-box h3 {
            margin-bottom: 30px;
            font-weight: 500;
        }

        .modal-btn {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 5px;
            color: white;
            font-size: 1.1rem;
        }

        .btn-no {
            background-color: var(--dark-gray);
        }

        .btn-yes {
            background-color: var(--blue-accent);
        }

        /* --- HISTORY VIEW --- */
        .history-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-light);
            z-index: 10000;
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .history-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .h-header-row,
        .h-row {
            display: grid;
            grid-template-columns: 50px 2fr 1fr 1fr 1fr;
            padding: 15px;
            text-align: center;
            align-items: center;
        }

        .h-header-row {
            background-color: #e5e5ea;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .h-header-row div:nth-child(2),
        .h-row div:nth-child(2) {
            text-align: left;
        }

        .h-row {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .h-arrow {
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .h-arrow.open {
            transform: rotate(90deg);
        }

        .h-details {
            display: none;
            background: var(--bg-light);
            padding: 20px 40px;
            border-radius: 12px;
            margin: 10px 20px 20px 50px;
            border: 2px solid #e5e5ea;
        }

        .hd-row,
        .hd-total {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            padding: 8px 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .hd-row div:nth-child(1),
        .hd-total div:nth-child(1) {
            text-align: left;
        }

        .hd-line {
            border-top: 2px dashed var(--dark-gray);
            margin: 15px 0;
        }

        .hd-total {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .btn-history-back {
            background-color: var(--dark-gray);
            color: white;
            padding: 15px 40px;
            border-radius: 25px;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            align-self: flex-start;
        }
    </style>
</head>

<body>

    <div class="main-panel">
        <div class="top-bar">
            <button id="backBtn" class="btn-back" onclick="loadCategories()">Back</button>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-bar" placeholder="Search products...">
            </div>
        </div>

        <div class="dynamic-grid" id="mainGrid"></div>

        <div class="bottom-bar">
            <div class="cashier-info" onclick="openLogoutModal()">
                Cashier:
                <span id="cashierName">Loading...</span>
            </div>
            <div class="action-buttons">
                <button class="btn-action" onclick="undo()">Undo</button>
                <button class="btn-action" onclick="redo()">Redo</button>
                <button class="btn-action" onclick="openNewOrderModal()">New</button>
                <button class="btn-action" onclick="openHistoryView()">History</button>
            </div>
        </div>
    </div>

    <div class="order-panel">
        <div class="order-header">
            <h2>ORDER:</h2>
        </div>

        <div class="order-table-headers">
            <div>ITEM</div>
            <div>PRC</div>
            <div>QTY</div>
            <div>ACTS</div>
        </div>

        <div class="order-items-list" id="orderList"></div>

        <div class="order-total-section">
            <span>TOTAL:</span>
            <span id="cartTotal">₱0.00</span>
        </div>

        <button class="btn-place-order" onclick="openFinishOrderModal()">Place Order</button>
    </div>

    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <h3 id="logoutMessage">Do you want to logout?</h3>
            <button class="modal-btn btn-no" onclick="closeLogoutModal()">No</button>
            <button class="modal-btn btn-yes" onclick="confirmLogout()">Yes</button>
        </div>
    </div>

    <div class="modal-overlay" id="newOrderModal">
        <div class="modal-box">
            <h3 style="line-height: 1.4;">Cancel and Create<br>New Order?</h3>
            <button class="modal-btn btn-no" onclick="closeNewOrderModal()">No</button>
            <button class="modal-btn btn-yes" onclick="confirmNewOrder()">Yes</button>
        </div>
    </div>

    <div class="modal-overlay" id="finishOrderModal">
        <div class="modal-box">
            <h3>Finish Order?</h3>
            <button class="modal-btn btn-no" onclick="closeFinishOrderModal()">No</button>
            <button class="modal-btn btn-yes" id="confirmOrderBtn" onclick="confirmFinishOrder()">Yes</button>
        </div>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-box" style="padding-top: 30px;">
            <div
                style="width: 80px; height: 80px; background-color: #34C759; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3 style="margin-bottom: 30px; font-weight: 600;">Order Placed Successfully</h3>
            <button class="modal-btn btn-yes" style="width: 150px;" onclick="closeSuccessModal()">Okay</button>
        </div>
    </div>

    <div class="history-view" id="historyView">
        <div class="history-title">HISTORY</div>
        <div class="history-container">
            <div class="h-header-row">
                <div></div>
                <div>Date</div>
                <div>Qty of Items</div>
                <div>Total Price</div>
                <div>Cashier</div>
            </div>
            <div id="historyList"></div>
        </div>
        <button class="btn-history-back" onclick="closeHistoryView()">Back</button>
    </div>

    <script>
        // --- APP STATE ---
        let cart = [];
        let historyState = [[]];
        let historyIndex = 0;

        // --- AUTH SYSTEM LOOKUP ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Verify authoritative server-side session state
                const response = await fetch('funcs/check_session.php');
                const result = await response.json();

                if (result.authenticated === true) {
                    document.getElementById('cashierName').innerText = result.username;
                    loadCategories(); // This likely triggers your product loading later!
                } else {
                    window.location.href = "index.html";
                }
            } catch (error) {
                console.error("Session verification failed:", error);
                window.location.href = "index.html";
            }
        });

        // --- CATEGORIES VIEW ---
        async function loadCategories() {
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('searchInput').value = '';
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '<p style="grid-column: span 3; text-align: center;">Loading Categories...</p>';

            try {
                const response = await fetch('funcs/get_categories.php');
                const result = await response.json();
                if (result.success) {
                    grid.innerHTML = '';
                    const iconMap = {
                        'candy': '🍬', 'biscuit': '🍪', 'junk food': '🍟',
                        'meal': '🍗', 'beverage': '🥤', 'alcohol': '🍸',
                        'hygiene': '🪥', 'utensils': '🍴', 'clothing': '👕'
                    };
                    result.data.forEach(cat => {
                        const icon = iconMap[cat.category_name.toLowerCase()] || '🔵';

                        const card = document.createElement('div');
                        card.className = 'category-card';
                        card.onclick = () => loadProducts(cat.category_id);
                        card.innerHTML = `
                            <div class="icon">${icon}</div>
                            <div class="name">${cat.category_name}</div>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                grid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: red;">Failed to load categories.</p>';
            }
        }

        // --- PRODUCTS LISTING VIEW ---
        async function loadProducts(categoryId = null, searchQuery = null) {
            // Only show back button if accessing inside an isolated category catalog
            document.getElementById('backBtn').style.display = searchQuery ? 'none' : 'block';
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '<p style="grid-column: span 3; text-align: center;">Loading Products...</p>';

            let url = 'funcs/get_products.php?';
            if (categoryId) url += `category_id=${categoryId}`;
            if (searchQuery) url += `search=${encodeURIComponent(searchQuery)}`;

            try {
                const response = await fetch(url);
                const result = await response.json();

                if (result.success) {
                    grid.innerHTML = '';
                    if (result.data.length === 0) {
                        grid.innerHTML = '<p style="grid-column: span 3; text-align: center;">No items found.</p>';
                        return;
                    }

                    result.data.forEach(prod => {
                        const stock = parseInt(prod.stock_quantity) || 0;
                        const isOOS = stock <= 0;

                        const card = document.createElement('div');
                        card.className = isOOS ? "product-card out-of-stock" : "product-card";

                        if (!isOOS) {
                            card.onclick = () => addToCart(prod.product_id, prod.product_name, parseFloat(prod.unit_price), stock);
                        }

                        card.innerHTML = `
                            ${isOOS ? '<div class="oos-overlay">Out of Stock</div>' : ''}
                            <img src="${prod.image}" onerror="this.src='./../resources/logo.jpg'">
                            <div class="details">
                                <div class="name">${prod.product_name}</div>
                                <div class="price">₱${parseFloat(prod.unit_price).toFixed(2)}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Failed to load products:", error);
                grid.innerHTML = '<p style="grid-column: span 3; text-align: center; color: red;">Failed to load products.</p>';
            }
        }

        // --- SEARCH ENGINE INTERACTION ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                loadProducts(null, query);
            } else {
                loadCategories();
            }
        });

        // --- CART LOGIC MAPPING ---
        function addToCart(id, name, price, maxStock) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty < maxStock) {
                    existing.qty++;
                } else {
                    alert(`Action denied. Only ${maxStock} units available.`);
                    return;
                }
            } else {
                cart.push({ id, name, price, qty: 1, maxStock });
            }
            saveState();
        }

        function setExactQty(id, newQty, maxStock) {
            let qty = parseInt(newQty);
            if (isNaN(qty) || qty <= 0) {
                removeFromCart(id);
                return;
            }
            if (qty > maxStock) {
                alert(`Insufficient supply. Cap threshold at ${maxStock}.`);
                qty = maxStock;
            }
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty = qty;
                saveState();
            }
        }

        function updateQty(id, change, maxStock) {
            const item = cart.find(i => i.id === id);
            if (item) {
                let newQty = item.qty + change;
                if (newQty > maxStock) {
                    alert(`Only ${maxStock} units are available.`);
                    return;
                }
                item.qty = newQty;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                saveState();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveState();
        }

        // --- UNDO / REDO STATE MACHINE ---
        function saveState() {
            historyState = historyState.slice(0, historyIndex + 1);
            historyState.push(JSON.parse(JSON.stringify(cart)));
            historyIndex++;
            renderCart();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                cart = JSON.parse(JSON.stringify(historyState[historyIndex]));
                renderCart();
            }
        }

        function redo() {
            if (historyIndex < historyState.length - 1) {
                historyIndex++;
                cart = JSON.parse(JSON.stringify(historyState[historyIndex]));
                renderCart();
            }
        }

        function clearCart() {
            cart = [];
            saveState();
        }

        function renderCart() {
            const list = document.getElementById('orderList');
            list.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;

                const row = document.createElement('div');
                row.className = 'cart-row';
                row.innerHTML = `
                    <div style="font-weight: 500; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${item.name}</div>
                    <div>₱${item.price.toFixed(2)}</div>
                    <div>
                        <input type="number" class="qty-input" value="${item.qty}" min="1">
                    </div>
                    <div class="cart-acts">
                        <span class="btn-minus">−</span>
                        <span class="btn-plus">+</span>
                        <span class="btn-del">🗑️</span>
                    </div>
                `;

                // Attaching listeners dynamically to completely block HTML payload execution exploits
                const input = row.querySelector('.qty-input');
                input.onchange = (e) => setExactQty(item.id, e.target.value, item.maxStock);
                input.onclick = (e) => e.target.select();

                row.querySelector('.btn-minus').onclick = () => updateQty(item.id, -1, item.maxStock);
                row.querySelector('.btn-plus').onclick = () => updateQty(item.id, 1, item.maxStock);
                row.querySelector('.btn-del').onclick = () => removeFromCart(item.id);

                list.appendChild(row);
            });

            document.getElementById('cartTotal').innerText = `₱${total.toFixed(2)}`;
        }

        // --- SYSTEM WORKFLOW MODALS ---
        function openLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
        }

        async function confirmLogout() {
            try {
                await fetch('funcs/logout.php');
            } finally {
                window.location.href = 'login.html';
            }
        }

        function openNewOrderModal() {
            if (cart.length > 0) document.getElementById('newOrderModal').style.display = 'flex';
        }

        function closeNewOrderModal() {
            document.getElementById('newOrderModal').style.display = 'none';
        }

        function confirmNewOrder() {
            clearCart();
            closeNewOrderModal();
        }

        function openFinishOrderModal() {
            if (cart.length > 0) {
                document.getElementById('finishOrderModal').style.display = 'flex';
            } else {
                alert("Please append matching items to the checkout cart space first.");
            }
        }

        function closeFinishOrderModal() {
            document.getElementById('finishOrderModal').style.display = 'none';
        }

        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        async function confirmFinishOrder() {
            const btn = document.getElementById('confirmOrderBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('funcs/save_order.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: cart }) // Dropped tracking payload variables. Managed internally on server context
                });

                const result = await response.json();

                if (result.success) {
                    cart = [];
                    historyState = [[]];
                    historyIndex = 0;
                    renderCart();
                    closeFinishOrderModal();
                    loadCategories();
                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    alert("Execution Error: " + result.message);
                }
            } catch (error) {
                alert("Critical engine error connection timeout mapping.");
            } finally {
                btn.innerText = "Yes";
                btn.disabled = false;
            }
        }

        // --- HISTORIC RECEIPT ARCHIVE ---
        async function openHistoryView() {
            document.getElementById('historyView').style.display = 'flex';
            const container = document.getElementById('historyList');
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Loading History Transactions...</p>';

            try {
                const response = await fetch('funcs/get_history.php');
                const result = await response.json();

                if (result.success) {
                    renderHistory(result.data);
                } else {
                    container.innerHTML = `<p style="text-align:center; color:red; padding: 20px;">Error: ${result.message}</p>`;
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align:center; color:red; padding: 20px;">Failed to gather record indexes.</p>';
            }
        }

        function closeHistoryView() {
            document.getElementById('historyView').style.display = 'none';
        }

        function renderHistory(data) {
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding: 20px;">No records located.</p>';
                return;
            }

            data.forEach((order, index) => {
                const dateObj = new Date(order.date);
                const dateStr = dateObj.toLocaleString('en-US', {
                    month: '2-digit', day: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                let detailsHTML = '';
                order.items.forEach(item => {
                    detailsHTML += `
                        <div class="hd-row">
                            <div>${item.name}</div>
                            <div>₱${parseFloat(item.price).toFixed(2)}</div>
                            <div>x${item.qty}</div>
                            <div>₱${parseFloat(item.subtotal).toFixed(2)}</div>
                        </div>
                    `;
                });

                const structuralWrapper = document.createElement('div');
                structuralWrapper.innerHTML = `
                    <div class="h-row">
                        <div class="h-arrow" id="arrow-${index}">&gt;</div>
                        <div>${dateStr}</div>
                        <div>${order.total_qty}</div>
                        <div>₱${parseFloat(order.total_price).toFixed(2)}</div>
                        <div>${order.cashier}</div>
                    </div>
                    <div class="h-details" id="details-${index}">
                        ${detailsHTML}
                        <div class="hd-line"></div>
                        <div class="hd-total">
                            <div>TOTAL VALUE</div>
                            <div></div>
                            <div>${order.total_qty} Items</div>
                            <div>₱${parseFloat(order.total_price).toFixed(2)}</div>
                        </div>
                    </div>
                `;

                structuralWrapper.querySelector('.h-arrow').onclick = () => toggleHistoryDetails(index);
                container.appendChild(structuralWrapper);
            });
        }

        function toggleHistoryDetails(index) {
            const details = document.getElementById(`details-${index}`);
            const arrow = document.getElementById(`arrow-${index}`);
            if (details.style.display === "block") {
                details.style.display = "none";
                arrow.classList.remove("open");
            } else {
                details.style.display = "block";
                arrow.classList.add("open");
            }
        }
    </script>
</body>

</html>
